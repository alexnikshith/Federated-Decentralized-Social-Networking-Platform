name: myapp
description: "Federated Decentralized Social Networking Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Image Handling
  cached_network_image: ^3.3.1
  image_picker: ^1.0.8

  # Routing
  go_router: ^14.0.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  timeago: ^3.6.1
  mime: ^1.0.5
  path: ^1.9.0
  path_provider: ^2.1.3

  # UI Components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
