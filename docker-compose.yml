services:
  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federated_social_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb+srv://kaushal:mongodb_123@ecoquest.kntdk2q.mongodb.net/federated_social?retryWrites=true&w=majority
      - DB_NAME=federated_social
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-min-32-chars
      - INSTANCE_ID=default-instance
    depends_on: []
    networks:
      - federated_network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: federated_social_frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - federated_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  federated_network:
    driver: bridge

