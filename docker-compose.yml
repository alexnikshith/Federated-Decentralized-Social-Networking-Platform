services:
  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federated_social_backend
    restart: unless-stopped
    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env
    environment:
      - INSTANCE_ID=default-instance
      - INSTANCE_DOMAIN=localhost:8080
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mongodb
    networks:
      - federated_network

  # Backend 2 (Community 2)
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federated_social_server2
    restart: unless-stopped
    ports:
      - "8081:8080" # Map host 8081 to container 8080
    env_file:
      - ./backend/.env
    environment:
      - INSTANCE_ID=community-2
      - INSTANCE_DOMAIN=localhost:8081
      - PORT=8080
      - DB_NAME=federated_social_server2
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mongodb
    networks:
      - federated_network

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: federated_social_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - mongodb_data:/data/db
    networks:
      - federated_network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: federated_social_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - VITE_API_URL=http://localhost:8080
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      - backend
    networks:
      - federated_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  federated_network:
    driver: bridge

volumes:
  mongodb_data:
