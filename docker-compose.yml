services:
  # Server 1 (Primary Instance)
  server1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federated_social_server1
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - INSTANCE_NAME=server1
      - INSTANCE_DOMAIN=localhost:8080
      - DB_NAME=federated_social
      - FEDERATION_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - federated_network

  # Server 2 (Secondary Instance)
  server2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federated_social_server2
    restart: unless-stopped
    ports:
      - "8081:8080" # Map internal port 8080 to host port 8081
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - INSTANCE_NAME=server2
      - INSTANCE_DOMAIN=localhost:8081
      - DB_NAME=federated_social_server2 # Different database name
      - FEDERATION_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - federated_network

  # Frontend (React + Vite) - Points to server1 by default
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: federated_social_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - VITE_API_URL=http://localhost:8080
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      - server1
    networks:
      - federated_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  federated_network:
    driver: bridge

volumes:
  mongodb_data:
